<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirana Chat Ledger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="login-screen" class="screen active">
      <div class="login-card">
        <div class="brand-block">
          <div class="brand-badge">₹</div>
          <h1>Kirana Chat Ledger</h1>
        </div>

        <p class="demo-text">Demo login</p>
        <div class="demo-credentials">
          <span>Username: shopkeeper</span>
          <span>Password: demo123</span>
        </div>

        <form id="login-form">
          <label>
            Username
            <input type="text" id="username" value="shopkeeper" />
          </label>
          <label>
            Password
            <input type="password" id="password" value="demo123" />
          </label>
          <button type="submit">Login</button>
        </form>
        <p id="login-message" class="message-box warning"></p>
      </div>
    </div>

    <div id="app-shell" class="screen hidden">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Vijaya Kirana</h2>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-view="chat">💬 Chat</button>
          <button class="nav-item" data-view="inventory">📦 Inventory</button>
          <button class="nav-item" data-view="udhaar">🧾 Udhaar</button>
          <button class="nav-item" data-view="stock">🗃️ Stock</button>
          <button class="nav-item" data-view="reports">📊 Reports</button>
        </nav>
        <button id="logout-button" class="logout-button">Logout</button>
      </aside>

      <main class="main-panel">
        <section id="view-chat" class="view active">
          <div class="page-header">
            <h2>Chat</h2>
            <div class="ai-status" id="ai-status">AI: checking…</div>
          </div>

          <div class="chat-window">
            <div id="chat-messages" class="chat-messages"></div>
            <form id="chat-form" class="chat-form">
              <textarea id="chat-input" rows="3" placeholder="Type a message like 'sold 3 maggi' or 'Ramesh paid 200'"></textarea>
              <div class="chat-actions">
                <button type="submit" class="primary-btn">Send</button>
              </div>
            </form>
          </div>
        </section>

        <section id="view-inventory" class="view">
          <div class="page-header">
            <h2>Inventory</h2>
          </div>
          <div id="inventory-list" class="card-grid"></div>
        </section>

        <section id="view-udhaar" class="view">
          <div class="page-header">
            <h2>Udhaar</h2>
            <button id="add-customer-btn" class="primary-btn">+ Add Customer</button>
          </div>

          <div class="two-column">
            <div class="panel">
              <h3>Customers</h3>
              <div id="customer-list" class="list-stack"></div>
            </div>
            <div class="panel">
              <h3>Customer Details</h3>
              <div id="customer-details" class="customer-details"></div>
            </div>
          </div>
        </section>

        <section id="view-stock" class="view">
          <div class="page-header">
            <h2>Stock</h2>
            <button id="add-stock-btn" class="primary-btn">+ Add Stock</button>
          </div>

          <form id="stock-form" class="hidden stock-form">
            <div class="field-grid">
              <label>
                Item name
                <input type="text" id="stock-name" />
              </label>
              <label>
                Quantity
                <input type="number" id="stock-quantity" min="1" step="1" />
              </label>
              <label>
                Unit
                <select id="stock-unit">
                  <option value="packets">packets</option>
                  <option value="bags">bags</option>
                  <option value="bottles">bottles</option>
                  <option value="pieces">pieces</option>
                  <option value="kg">kg</option>
                  <option value="litres">litres</option>
                  <option value="units">units</option>
                </select>
              </label>
              <label>
                Packet or bag size
                <input type="text" id="stock-packet-size" placeholder="500 ml, 10 kg" />
              </label>
              <label>
                Minimum stock
                <input type="number" id="stock-min" min="0" step="1" />
              </label>
              <label>
                Supplier name
                <input type="text" id="stock-supplier-name" />
              </label>
              <label>
                Supplier phone
                <input type="text" id="stock-supplier-phone" />
              </label>
            </div>
            <div class="submit-row">
              <button type="submit" class="primary-btn">Save item</button>
              <button type="button" id="cancel-stock-form" class="secondary-btn">Cancel</button>
            </div>
          </form>

          <div id="stock-list" class="stock-list"></div>
        </section>

        <section id="view-reports" class="view">
          <div class="page-header">
            <h2>Reports</h2>
          </div>
          <div id="reports-summary" class="summary-grid"></div>
          <div class="panel">
            <h3>Recent transactions</h3>
            <div id="recent-transactions" class="list-stack"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
