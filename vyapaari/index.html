<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vyapaari</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F8FAFC;--card:#fff;--tx:#0F172A;--tx2:#64748B;--bd:#E2E8F0;--pri:#2563EB;--prih:#1D4ED8;--ok:#15803D;--warn:#B45309;--bad:#DC2626;--soft:#EFF6FF;--navy:#101828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#111A2E;--tx:#E5EAF3;--tx2:#94A3B8;--bd:#223049;--soft:#13213D;--pri:#5B8DF6;--prih:#7BA3F8;--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#111A2E;--tx:#E5EAF3;--tx2:#94A3B8;--bd:#223049;--soft:#13213D;--pri:#5B8DF6;--prih:#7BA3F8;--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
nav{border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:end center;padding-bottom:6px;gap:2px}
.brand b{font:800 18px Manrope,sans-serif}.brand small{display:block;color:var(--tx2);font-size:11px;line-height:1}
nav button{text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--tx2)}
nav button:hover{background:var(--soft)}
nav button[aria-current=page]{background:var(--soft);color:var(--pri);font-weight:600;box-shadow:inset 0 1px 3px rgba(37,99,235,.18)}
.foot{margin-top:auto;font-size:12px;color:var(--tx2);padding:8px}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:clamp(26px,3.4vw,38px);font-weight:800}.top p{margin:2px 0 0;color:var(--tx2)}
.badge{font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:3px 8px;color:var(--tx2);background:var(--card)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--bd);border-radius:16px;background:var(--card);margin-bottom:20px;overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--bd)}.kpi:last-child{border:0}
.kpi span{display:block;color:var(--tx2);font-size:12.5px}.kpi b{font:800 22px Manrope,sans-serif}
.kpi i{font-style:normal;font-size:12px;color:var(--tx2)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px}
.chat{display:flex;flex-direction:column;min-height:520px;box-shadow:0 8px 24px -12px rgba(37,99,235,.35);border-color:rgba(37,99,235,.35)}
.chat header{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.chat header h2{font-size:20px}.chat header p{margin:0;color:var(--tx2);font-size:13px}
#log{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:520px}
.msg{max-width:88%;animation:in .18s ease-out}.me{align-self:flex-end;background:var(--pri);color:#fff;padding:8px 14px;border-radius:14px 14px 4px 14px}
.ai{align-self:flex-start;background:var(--soft);border:1px solid var(--bd);padding:12px 14px;border-radius:14px 14px 14px 4px}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:8px 0;font-size:14px}dt{color:var(--tx2)}dd{margin:0;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.chip,.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13.5px;box-shadow:0 1px 0 var(--bd)}
.chip:hover,.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn.p:hover{background:var(--prih);color:#fff}
.btn.d{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
form.comp{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd)}
.comp input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 14px}
.comp input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.2);outline:0}
.mic{width:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);box-shadow:0 2px 4px rgba(15,23,42,.1),inset 0 1px 0 #fff3;cursor:pointer}
.mic.on{background:var(--bad);color:#fff;box-shadow:inset 0 2px 4px #0004}
.rail{display:flex;flex-direction:column;gap:14px}.rail .card{padding:14px 16px}
.rail h3{font-size:15px;margin-bottom:6px}.rail p{margin:4px 0;font-size:13.5px;color:var(--tx2)}
.rail ul{padding:0;margin:0;list-style:none}.rail li{padding:8px 0;border-top:1px solid var(--bd);font-size:13.5px}.rail li:first-child{border:0}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid currentColor}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--tx2);font-weight:500;font-size:12.5px;cursor:pointer}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px}
.dead{border-left:4px solid var(--warn);padding:14px 18px;margin-bottom:12px}
.dead b{font:800 17px Manrope,sans-serif}.dead p{margin:4px 0;color:var(--tx2)}
.setup{max-width:440px;margin:6vh auto;padding:28px}.setup h1{font-size:32px;margin:14px 0 6px}
.setup label{display:block;margin-top:14px;font-weight:500;font-size:14px}
.setup input{width:100%;margin-top:4px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 14px}
.err{color:var(--bad);font-size:13px;min-height:18px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.menu{display:none}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-bottom:1px solid var(--bd)}}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{position:fixed;inset:0 auto 0 0;width:230px;z-index:8;background:var(--bg);transform:translateX(-100%);transition:transform .2s;height:100%}nav.open{transform:none}.menu{display:inline-block}.msg{max-width:96%}}
</style></head><body>
<div id="root"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='vyapaari.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const seed=()=>({store:null,view:'dash',settings:{deadDays:15,lead:2,lowDays:4,hiRisk:30,medRisk:15},
 products:[
 {id:'milk',name:'Milk',stock:15,unit:'packets',cat:'Dairy',last:0,cost:24,price:28,daily:8,alias:['milk','doodh']},
 {id:'rice',name:'Rice',stock:50,unit:'kg',cat:'Groceries',last:1,cost:42,price:48,daily:6,alias:['rice','chawal']},
 {id:'sugar',name:'Sugar',stock:10,unit:'kg',cat:'Groceries',last:3,cost:40,price:45,daily:3,alias:['sugar','cheeni']},
 {id:'curd',name:'Curd',stock:40,unit:'cups',cat:'Dairy',last:0,cost:12,price:15,daily:15,alias:['curd','dahi']},
 {id:'pickle',name:'Pickle Jar',stock:25,unit:'jars',cat:'Food',last:25,cost:50,price:65,daily:0,alias:['pickle','pickle jar','achar']},
 {id:'papad',name:'Papad Pack',stock:30,unit:'packs',cat:'Food',last:18,cost:20,price:28,daily:0,alias:['papad']}],
 sales:[{t:'Opening sample sales (demo)',amt:12450,undone:true}],
 customers:[{id:'ramesh',name:'Ramesh',bal:4500,age:42,lastPay:'Never'},{id:'suresh',name:'Suresh',bal:2000,age:18,lastPay:'12 days ago'},{id:'arjun',name:'Arjun',bal:1000,age:5,lastPay:'3 days ago'}],
 log:[],chat:[],dismissed:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2200)};
// ---- calculations
const supply=p=>p.daily>0?p.stock/p.daily:Infinity;
const isDead=p=>p.last>=S.settings.deadDays;
const isLow=p=>!isDead(p)&&supply(p)<=S.settings.lowDays;
const status=p=>isDead(p)?['Dead','t-warn']:isLow(p)?['Low','t-bad']:['Healthy','t-ok'];
const blocked=p=>p.stock*p.cost;
const reorderQty=p=>Math.max(0,Math.ceil(p.daily*(S.settings.lead+7)-p.stock));
const risk=c=>c.bal<=0?['Clear','t-ok']:c.age>S.settings.hiRisk?['High','t-bad']:c.age>=S.settings.medRisk?['Medium','t-warn']:['Low','t-ok'];
const todaySales=()=>S.sales.filter(s=>!s.undone).reduce((a,s)=>a+s.amt,0);
const health=()=>Math.max(0,100-8*S.products.filter(isLow).length-6*S.products.filter(isDead).length);
const find=q=>{q=q.toLowerCase();return S.products.find(p=>p.alias.some(a=>new RegExp('\\b'+a+'s?\\b').test(q)))};
// ---- assistant (deterministic demo intelligence, no LLM)
const brief=(title,rows)=>`<b>${title}</b><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
function ask(q){
 const t=q.toLowerCase().trim();let m;
 if((m=t.match(/^(?:sold|sell)\s+(-?\d+(?:\.\d+)?)\s*(?:\w+\s+of\s+)?(.+)$/))){
  const n=+m[1],p=find(m[2]);
  if(!p)return{h:`I couldn't find "${esc(m[2])}" in your products. Try a name from the Inventory page.`};
  if(!(n>0))return{h:'Quantity must be more than zero.'};
  if(n>p.stock)return{h:`You only have ${p.stock} ${p.unit} of ${p.name}. I won't let stock go negative.`};
  const prev=p.stock;p.stock-=n;const prevLast=p.last;p.last=0;
  S.sales.push({t:`${n} ${p.name}`,amt:n*p.price,pid:p.id});
  const id=S.log.push({kind:'sell',pid:p.id,n,prevLast,amt:n*p.price,undone:false})-1;
  const d=supply(p);
  return{h:'Done — I\'ve updated the stock.'+brief(p.name,[['Quantity sold',`${n} ${p.unit}`],['Previous stock',prev],['Remaining stock',p.stock],['Status',status(p)[0]],['Supply left',isFinite(d)?`about ${d.toFixed(1)} days at ${p.daily}/day (demo average)`:'no recent sales data'],['Suggested reorder',`${reorderQty(p)} ${p.unit}`]]),acts:[['Review reorder','go:inv'],['Undo update','undo:'+id]]};}
 if((m=t.match(/^(?:add|received)\s+(\d+(?:\.\d+)?)\s*(?:\w+\s+of\s+)?(.+?)(?:\s+to\s+stock)?$/))){
  const n=+m[1],p=find(m[2]);if(!p)return{h:`I couldn't find "${esc(m[2])}".`};
  const prev=p.stock;p.stock+=n;const id=S.log.push({kind:'add',pid:p.id,n,undone:false})-1;
  return{h:'Stock added.'+brief(p.name,[['Added',`${n} ${p.unit}`],['Previous',prev],['Now',p.stock]]),acts:[['Undo update','undo:'+id]]};}
 if((m=t.match(/(?:record|received|got)\s+(?:₹|rs\.?\s*)?(\d+)\s*(?:rupees|rs|₹)?\s*(?:received\s+)?from\s+(\w+)/))){
  const c=S.customers.find(x=>x.name.toLowerCase()===m[2]);if(!c)return{h:`No customer named ${esc(m[2])} in the ledger.`};
  const a=+m[1];if(a>c.bal)return{h:`${c.name} owes only ${inr(c.bal)}. Check the amount.`};
  return{h:'Please confirm before I change money records.'+brief('Payment from '+c.name,[['Amount',inr(a)],['Balance now',inr(c.bal)],['Balance after',inr(c.bal-a)]]),acts:[['Confirm payment',`pay:${c.id}:${a}`],['Cancel','noop']]};}
 if(/left|stock of|how much/.test(t)){const p=find(t);if(p)return{h:`${p.name}: ${p.stock} ${p.unit} in stock (${status(p)[0].toLowerCase()}).`};}
 if(/reorder|order today/.test(t)){const r=S.products.filter(p=>reorderQty(p)>0&&!isDead(p)).sort((a,b)=>supply(a)-supply(b));
  return{h:'Reorder in this order (most urgent first):'+brief('Suggestions',r.map(p=>[p.name,`${reorderQty(p)} ${p.unit} · ${supply(p).toFixed(1)} days left`]))+`<small>Rule: daily sales × (${S.settings.lead}-day lead time + 7-day buffer) − current stock. Simple arithmetic, not a forecast.</small>`};}
 if(/dead|not selling|haven.?t sold|blocked|tying/.test(t)){const d=S.products.filter(isDead);
  return{h:d.length?`${d.length} products haven't sold in ${S.settings.deadDays}+ days, holding ${inr(d.reduce((a,p)=>a+blocked(p),0))}:`+brief('Dead stock',d.map(p=>[p.name,`${p.last} days · ${inr(blocked(p))}`])):'Nothing is stuck right now.',acts:[['Review dead stock','go:inv']]};}
 if(/low/.test(t)){const d=S.products.filter(isLow);return{h:d.length?'Running low:'+brief('Low stock',d.map(p=>[p.name,`${p.stock} ${p.unit}`])):'No product is running low.'};}
 if(/owe|credit|udhar/.test(t)){const c=[...S.customers].filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal);
  return{h:`${inr(c.reduce((a,x)=>a+x.bal,0))} is outstanding.`+brief('Who owes you',c.map(x=>[x.name,`${inr(x.bal)} · ${x.age} days · ${risk(x)[0]}`])),acts:[['Open ledger','go:led']]};}
 if(/sales today|today.?s sales|my sales/.test(t))return{h:`Today's sales so far: ${inr(todaySales())} (includes a demo opening figure).`};
 if(/why|week|change/.test(t))return{h:'I don\'t have a week-over-week history in this demo, so I won\'t guess at a trend. Ask what to reorder or what\'s not selling instead.'};
 return{h:'I didn\'t understand that. Try "Sold 10 milk packets", "What should I reorder?", or "Who owes me money?"'};}
function act(a){
 const [k,x,y]=a.split(':');
 if(k==='go'){S.view=x;render();return}
 if(k==='undo'){const e=S.log[+x];if(!e||e.undone){toast('Already undone');return}
  const p=S.products.find(q=>q.id===e.pid);
  if(e.kind==='sell'){p.stock+=e.n;p.last=e.prevLast;const s=S.sales.find(z=>z.pid===e.pid&&!z.undone&&z.amt===e.amt);if(s)s.undone=true}
  else{if(p.stock<e.n){toast('Cannot undo: stock already sold');return}p.stock-=e.n}
  e.undone=true;toast('Update undone');}
 if(k==='pay'){const c=S.customers.find(z=>z.id===x);const n=+y;if(n>c.bal)return;c.bal-=n;c.lastPay='Today';if(c.bal===0)c.age=0;toast(`Recorded ${inr(n)} from ${c.name}`);}
 if(k==='noop')toast('Cancelled');
 save();render();}
function send(q){q=q.trim();if(!q)return;S.chat.push({me:1,h:esc(q)});S.chat.push({...ask(q)});save();render();setTimeout(()=>{const l=$('#log');if(l)l.scrollTop=l.scrollHeight;const i=$('#q');if(i)i.focus()},0)}
// ---- views
const nav=[['dash','Dashboard'],['inv','Inventory'],['led','Credit ledger'],['set','Settings']];
function insights(){
 const low=S.products.filter(isLow).sort((a,b)=>supply(a)-supply(b));
 const dead=S.products.filter(isDead).filter(p=>!S.dismissed.includes(p.id)).sort((a,b)=>blocked(b)-blocked(a));
 return`<aside class="rail" aria-label="Insights">
 <section class="card"><h3>What to reorder</h3><ul>${low.map(p=>`<li><span class="tag t-bad">Low</span> <b>${p.name}</b><br>${supply(p).toFixed(1)} days of supply left. Order ${reorderQty(p)} ${p.unit}.</li>`).join('')||'<li>All stocked well.</li>'}</ul></section>
 <section class="card"><h3>Money stuck on shelves</h3>${dead[0]?`<p><b style="color:var(--tx)">${dead[0].name}</b> — ${dead[0].last} days without a sale.</p><p>${inr(blocked(dead[0]))} tied up (${dead[0].stock} × ${inr(dead[0].cost)}).</p><div class="acts"><button class="btn" data-act="go:inv">Review</button></div>`:'<p>No dead stock.</p>'}</section></aside>`}
function dash(){
 const P=S.products,d=P.filter(isDead),h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 const kp=[["Today's sales",inr(todaySales()),'sample figure'],['Low stock',P.filter(isLow).length,'by days of supply'],['Dead stock',d.length,`${S.settings.deadDays}+ days unsold`],['Credit pending',inr(S.customers.reduce((a,c)=>a+c.bal,0)),'from ledger'],['Inventory health',health()+'%','100 − 8/low − 6/dead']];
 const sug=['What should I reorder today?','Show me products that haven\'t sold.','Who owes me money?','Which products are tying up my money?'];
 return`<div class="top"><div><h1>${g}, ${esc(S.store.owner)}</h1><p>Here's what needs your attention today.</p></div><span class="badge">${new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})} · Demo data</span></div>
 <div class="kpis">${kp.map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b> <i>${k[2]}</i></div>`).join('')}</div>
 <div class="grid"><section class="card chat" aria-label="ShelfMind AI"><header><div><h2>ShelfMind AI</h2><p>Your business, understood.</p></div><span class="badge">Demo intelligence · no LLM</span></header>
 <div id="log" aria-live="polite">${S.chat.length?S.chat.map(m=>m.me?`<div class="msg me">${m.h}</div>`:`<div class="msg ai">${m.h}${m.acts?`<div class="acts">${m.acts.map(a=>`<button class="btn ${/Confirm|Undo/.test(a[0])?(/Confirm/.test(a[0])?'p':'d'):''}" data-act="${a[1]}">${a[0]}</button>`).join('')}</div>`:''}</div>`).join(''):'<div class="msg ai">Tell me what happened in the shop, like <b>Sold 10 milk packets</b>, or ask what to do next.</div>'}</div>
 <div class="chips">${sug.map(s=>`<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <form class="comp" id="f"><input id="q" aria-label="Message ShelfMind" placeholder="Type or speak. e.g. Sold 10 milk packets" autocomplete="off"><button type="button" class="mic" id="mic" aria-label="Start voice input">🎤</button><button class="btn p">Send</button>${S.chat.length?'<button type="button" class="btn" id="new">New</button>':''}</form></section>${insights()}</div>`}
function inv(){
 const f=S.f||(S.f={q:'',cat:'',st:'',sort:'name'});
 let r=S.products.filter(p=>p.name.toLowerCase().includes(f.q.toLowerCase())&&(!f.cat||p.cat===f.cat)&&(!f.st||status(p)[0]===f.st));
 r.sort((a,b)=>f.sort==='stock'?a.stock-b.stock:f.sort==='last'?b.last-a.last:a.name.localeCompare(b.name));
 const dead=S.products.filter(isDead).sort((a,b)=>blocked(b)-blocked(a));const tot=dead.reduce((a,p)=>a+blocked(p),0);
 return`<div class="top"><div><h1>What's sitting on your shelves?</h1><p>${inr(tot)} is tied up in ${dead.length} products that haven't sold in ${S.settings.deadDays}+ days.</p></div></div>
 ${dead.map(p=>{const dis=S.dismissed.includes(p.id);return`<div class="dead card" ${dis?'style="opacity:.55"':''}><b>${p.name}</b> <span class="tag t-warn">${p.last>=S.settings.deadDays*1.5?'High':'Medium'} priority</span><p>${p.last} days without a sale. ${p.stock} ${p.unit} × ${inr(p.cost)} = <b style="color:var(--tx)">${inr(blocked(p))}</b> blocked.</p><p>Suggested: test a 10% discount (${inr(p.price)} → ${inr(p.price*.9)}). Nothing changes until you decide.</p><div class="acts"><button class="btn" data-act="draft:${p.id}">Draft promotion</button><button class="btn" data-act="dismiss:${p.id}">${dis?'Restore alert':'Dismiss alert'}</button></div></div>`}).join('')||'<p>No dead stock. Nice.</p>'}
 <h2 style="margin:24px 0 12px;font-size:20px">All products</h2>
 <div class="tools"><input id="s" placeholder="Search products" aria-label="Search" value="${esc(f.q)}"><select id="c" aria-label="Category"><option value="">All categories</option>${[...new Set(S.products.map(p=>p.cat))].map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select><select id="st" aria-label="Status"><option value="">Any status</option>${['Healthy','Low','Dead'].map(c=>`<option ${f.st===c?'selected':''}>${c}</option>`).join('')}</select><select id="so" aria-label="Sort"><option value="name">Sort: name</option><option value="stock" ${f.sort==='stock'?'selected':''}>Sort: stock</option><option value="last" ${f.sort==='last'?'selected':''}>Sort: longest unsold</option></select></div>
 <div class="card tw"><table><thead><tr><th>Product</th><th>Stock</th><th>Unit</th><th>Category</th><th>Last sold</th><th>Status</th><th>Actions</th></tr></thead><tbody>${r.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.stock}</td><td>${p.unit}</td><td>${p.cat}</td><td>${p.last===0?'Today':p.last===1?'Yesterday':p.last+' days ago'}</td><td><span class="tag ${status(p)[1]}">${status(p)[0]}</span></td><td><button class="btn" data-act="adj:${p.id}">Adjust</button></td></tr>`).join('')||'<tr><td colspan="7">No products match.</td></tr>'}</tbody></table></div>`}
function led(){
 const c=[...S.customers].sort((a,b)=>b.bal-a.bal);
 return`<div class="top"><div><h1>Who owes you</h1><p>${inr(c.reduce((a,x)=>a+x.bal,0))} outstanding. High risk means unpaid over ${S.settings.hiRisk} days.</p></div></div>
 <div class="card tw"><table><thead><tr><th>Customer</th><th>Balance</th><th>Days unpaid</th><th>Risk</th><th>Last payment</th><th>Actions</th></tr></thead><tbody>${c.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${inr(x.bal)}</td><td>${x.bal?x.age:'—'}</td><td><span class="tag ${risk(x)[1]}">${risk(x)[0]}</span></td><td>${x.lastPay}</td><td><button class="btn" data-act="payui:${x.id}">Record payment</button></td></tr>`).join('')}</tbody></table></div>`}
function set(){const s=S.settings;
 const fld=(k,l)=>`<label>${l}<input type="number" min="1" data-set="${k}" value="${s[k]}"></label>`;
 return`<div class="top"><div><h1>Settings</h1><p>Thresholds change every calculation instantly.</p></div></div><div class="card setup" style="margin:0;max-width:440px">${fld('deadDays','Dead-stock after (days unsold)')}${fld('lowDays','Low stock when supply is under (days)')}${fld('lead','Supplier lead time (days)')}${fld('hiRisk','High credit risk after (days)')}${fld('medRisk','Medium credit risk after (days)')}<div class="acts" style="margin-top:18px"><button class="btn d" id="reset">Reset to demo data</button></div></div>`}
function setup(){return`<main><form class="card setup" id="su" novalidate><div class="mark" aria-hidden="true"><svg width="14" height="12" viewBox="0 0 14 12"><rect x="0" y="6" width="4" height="6" fill="#5B8DF6"/><rect x="5" y="2" width="4" height="10" fill="#fff"/><rect x="10" y="0" width="4" height="12" fill="#5B8DF6"/></svg></div><h1>Turn inventory data into business decisions.</h1><p style="color:var(--tx2)">Meet ShelfMind AI. Know what to stock, what to sell, and where your money is stuck.</p>
 <label>Your name<input name="owner" autocomplete="name"></label><label>Phone number<input name="phone" inputmode="tel" placeholder="98765 43210"></label><label>Store name<input name="store"></label><label>Location<input name="loc"></label><div class="err" id="e" role="alert"></div>
 <button class="btn p" style="width:100%;padding:11px;margin-top:6px">Set up my store</button><p style="font-size:12.5px;color:var(--tx2)">Demo setup: your phone number is not verified, and data stays in this browser.</p></form></main>`}
function render(){
 const r=$('#root');
 if(!S.store){r.innerHTML=setup();bind();return}
 const v={dash,inv,led,set}[S.view]();
 r.innerHTML=`<div class="app"><nav id="nav" aria-label="Main"><div class="brand"><div class="mark" aria-hidden="true"><svg width="14" height="12" viewBox="0 0 14 12"><rect x="0" y="6" width="4" height="6" fill="#5B8DF6"/><rect x="5" y="2" width="4" height="10" fill="#fff"/><rect x="10" y="0" width="4" height="12" fill="#5B8DF6"/></svg></div><div><b>Vyapaari</b><small>Your store, with better decisions</small></div></div>${nav.map(n=>`<button data-act="go:${n[0]}" ${S.view===n[0]?'aria-current="page"':''}>${n[1]}</button>`).join('')}<div class="foot"><b style="color:var(--tx)">${esc(S.store.name)}</b><br>${esc(S.store.loc)}<br><button class="btn" id="out" style="margin-top:8px">Log out</button></div></nav><main><button class="btn menu" id="menu" aria-label="Open menu">Menu</button>${v}</main></div>`;
 bind();}
function bind(){
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
  if(a.startsWith('go:')){$('#nav')&&$('#nav').classList.remove('open')}
  if(a.startsWith('draft:')){const p=S.products.find(x=>x.id===a.slice(6));toast(`Draft saved: ${p.name} at ${inr(p.price*.9)}. Not live.`);return}
  if(a.startsWith('dismiss:')){const i=a.slice(8),k=S.dismissed.indexOf(i);k<0?S.dismissed.push(i):S.dismissed.splice(k,1);save();render();return}
  if(a.startsWith('adj:')){const p=S.products.find(x=>x.id===a.slice(4)),v=prompt(`New stock count for ${p.name} (${p.unit})`,p.stock);if(v===null)return;const n=+v;if(!Number.isFinite(n)||n<0||v.trim()===''){toast('Enter a number, zero or more');return}p.stock=n;save();render();return}
  if(a.startsWith('payui:')){const c=S.customers.find(x=>x.id===a.slice(6)),v=prompt(`Payment received from ${c.name} (owes ${inr(c.bal)})`);if(v===null)return;const n=+v;if(!(n>0)||n>c.bal){toast('Amount must be more than 0 and at most '+inr(c.bal));return}if(confirm(`Record ${inr(n)} from ${c.name}? Balance becomes ${inr(c.bal-n)}.`))act(`pay:${c.id}:${n}`);return}
  act(a)});
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
 document.querySelectorAll('[data-set]').forEach(i=>i.onchange=()=>{const n=+i.value;if(n>0){S.settings[i.dataset.set]=n;save();toast('Saved')}});
 const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();const i=$('#q');const v=i.value;i.value='';send(v)};
 const nw=$('#new');if(nw)nw.onclick=()=>{S.chat=[];save();render()};
 const m=$('#mic');if(m)m.onclick=voice;
 ['s','c','st','so'].forEach(id=>{const e=$('#'+id);if(e)e.oninput=()=>{const k={s:'q',c:'cat',st:'st',so:'sort'}[id];S.f[k]=e.value;render();if(id==='s'){const x=$('#s');x.focus();x.setSelectionRange(99,99)}}});
 const rs=$('#reset');if(rs)rs.onclick=()=>{if(confirm('Replace all data with the demo data?')){const st=S.store;S=seed();S.store=st;save();render()}};
 const o=$('#out');if(o)o.onclick=()=>{S.store=null;save();render()};
 const mn=$('#menu');if(mn)mn.onclick=()=>$('#nav').classList.toggle('open');
 const su=$('#su');if(su)su.onsubmit=e=>{e.preventDefault();const d=new FormData(su),ph=String(d.get('phone')).replace(/[\s-]/g,'').replace(/^(\+91|91|0)(?=\d{10}$)/,'');
  const er=!d.get('owner').trim()?'Enter your name.':!/^[6-9]\d{9}$/.test(ph)?'Enter a 10-digit Indian mobile number starting with 6–9.':!d.get('store').trim()?'Enter your store name.':!d.get('loc').trim()?'Enter your location.':'';
  $('#e').textContent=er;if(er)return;S.store={owner:d.get('owner').trim(),phone:ph,name:d.get('store').trim(),loc:d.get('loc').trim()};save();render()}}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,m=$('#mic');
 if(!SR){toast('Voice input isn\'t supported in this browser. Type instead.');return}
 if(window._rec){window._rec.stop();return}
 const r=window._rec=new SR();r.lang='en-IN';r.onstart=()=>{m.classList.add('on');m.setAttribute('aria-label','Stop recording')};
 r.onresult=e=>{$('#q').value=e.results[0][0].transcript};
 r.onerror=e=>toast(e.error==='not-allowed'?'Microphone permission denied.':'Voice input failed. Try again.');
 r.onend=()=>{window._rec=null;m.classList.remove('on');m.setAttribute('aria-label','Start voice input');const q=$('#q');if(q)q.focus()};r.start()}
render();
</script></body></html>
